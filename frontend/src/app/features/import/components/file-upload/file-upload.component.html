<div
  class="file-upload {{ isDragging() ? 'dragging' : '' }}"
  data-cy="file-upload"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (errorMessage()) {
    <div class="error-message" data-cy="error-message">{{ errorMessage() }}</div>
  }

  <div class="upload-area">
    <div class="upload-icon">📁</div>
    <h3>Upload Questions</h3>
    <p>Drag and drop a CSV or JSON file here, or click to browse</p>
    <p class="hint">Maximum file size: {{ maxFileSizeMB }}MB</p>

    <input
      type="file"
      #fileInput
      accept=".csv,.json"
      (change)="onFileInput($event)"
      class="file-input"
    />

    <button class="browse-btn" (click)="fileInput.click()">Browse Files</button>

    @if (errorMessage()) {
      <button class="retry-btn" (click)="clearError()">Try Again</button>
    }
  </div>
</div>
